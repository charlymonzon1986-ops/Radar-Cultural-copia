name: Bot Radar Cultural (Telegram)

on:
  schedule:
    # Cada 5 minutos: lee mensajes y botones pendientes
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: bot-radar-cultural
  cancel-in-progress: false

jobs:
  procesar-mensajes:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias del scraper
        working-directory: scripts/scraper
        run: npm install --omit=dev

      - name: Procesar mensajes y botones de Telegram
        working-directory: scripts/scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node bot.js
