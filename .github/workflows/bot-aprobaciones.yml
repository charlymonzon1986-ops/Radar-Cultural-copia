name: Bot de aprobaciones Telegram

on:
  schedule:
    # Cada 5 minutos
    - cron: '*/5 * * * *'
  workflow_dispatch:

# Evita que dos corridas lean los mismos updates a la vez
concurrency:
  group: bot-aprobaciones
  cancel-in-progress: false

jobs:
  procesar-aprobaciones:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias del scraper
        working-directory: scripts/scraper
        run: npm install --omit=dev

      - name: Procesar clics de Telegram
        working-directory: scripts/scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: node approval-poll.js
